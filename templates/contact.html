{% extends "base.html" %}
{% block title %}Contact · {{ site.name }}{% endblock %}
{% block content %}
<header class="page-header"><h1>Contact</h1></header>
<ul class="links">
  {% for l in site.links %}
  <li><span class="link-label">{{ l.label }}</span> <a href="{{ l.url }}">{{ l.text }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
