{% extends "base.html" %}
{% from "_macros.html" import post_item %}
{% block content %}
<header class="page-header hero">
  <h1>{{ site.name }}</h1>
  <div class="lead prose">{{ intro | safe }}</div>
</header>

{% if posts %}
<section>
  <h2 class="list-heading">Recent updates</h2>
  <ul class="post-list">
    {% for p in posts %}{{ post_item(p) }}{% endfor %}
  </ul>
  <p class="more"><a href="/blog/">All articles →</a></p>
</section>
{% endif %}
{% endblock %}
